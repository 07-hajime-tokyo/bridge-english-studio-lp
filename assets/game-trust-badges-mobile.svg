<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 390" role="img" aria-labelledby="title desc">
  <title id="title">中古ゲーム機買取の3つの安心ポイント</title>
  <desc id="desc">査定無料、箱なしOK、宅配対応を縦に並べた認定証風画像</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-16%" width="120%" height="138%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17324f" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="redGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#56a6e8"/>
      <stop offset="1" stop-color="#0b63ce"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#59cf9a"/>
      <stop offset="1" stop-color="#11a86b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe8a8"/>
      <stop offset="1" stop-color="#d79b24"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(18 18)">
      <rect width="354" height="106" rx="22" fill="#fff"/>
      <path d="M22 0h310a22 22 0 0 1 22 22v10H0V22A22 22 0 0 1 22 0Z" fill="url(#redGrad)"/>
      <circle cx="58" cy="66" r="25" fill="url(#goldGrad)"/>
      <circle cx="58" cy="66" r="18" fill="#fff8df" stroke="#b77c12" stroke-width="2.5"/>
      <path d="M48 68h20M51 61h14M52 75h11" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      <path d="m47 89-9 21 17-7 5 16 9-25Z" fill="#f97316"/>
      <path d="m69 89 9 21-17-7-5 16-9-25Z" fill="#0b63ce"/>
      <text x="220" y="60" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="27" font-weight="900" fill="#151b22">査定無料</text>
      <text x="220" y="88" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="15" font-weight="800" fill="#52606f">キャンセル料もかかりません</text>
    </g>

    <g transform="translate(18 142)">
      <rect width="354" height="106" rx="22" fill="#fff"/>
      <path d="M22 0h310a22 22 0 0 1 22 22v10H0V22A22 22 0 0 1 22 0Z" fill="url(#blueGrad)"/>
      <circle cx="58" cy="66" r="25" fill="url(#blueGrad)"/>
      <circle cx="58" cy="66" r="18" fill="#f4fbff" stroke="#0b63ce" stroke-width="2.5"/>
      <path d="M47 72h22l5-14H42l5 14Z" fill="none" stroke="#0b63ce" stroke-width="4" stroke-linejoin="round"/>
      <path d="M49 80h18M53 58v-6h12v6" fill="none" stroke="#0b63ce" stroke-width="4" stroke-linecap="round"/>
      <path d="m47 89-9 21 17-7 5 16 9-25Z" fill="#0b63ce"/>
      <path d="m69 89 9 21-17-7-5 16-9-25Z" fill="#08a4c7"/>
      <text x="220" y="59" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="27" font-weight="900" fill="#151b22">箱なしOK</text>
      <text x="220" y="86" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="14" font-weight="800" fill="#52606f">本体のみ・ケーブル不足も相談可</text>
    </g>

    <g transform="translate(18 266)">
      <rect width="354" height="106" rx="22" fill="#fff"/>
      <path d="M22 0h310a22 22 0 0 1 22 22v10H0V22A22 22 0 0 1 22 0Z" fill="url(#greenGrad)"/>
      <circle cx="58" cy="66" r="25" fill="url(#greenGrad)"/>
      <circle cx="58" cy="66" r="18" fill="#f4fff8" stroke="#11a86b" stroke-width="2.5"/>
      <path d="M44 71h28V60H44v11Z" fill="none" stroke="#11a86b" stroke-width="4" stroke-linejoin="round"/>
      <path d="M50 60v-6h17v6M50 79h17" fill="none" stroke="#11a86b" stroke-width="4" stroke-linecap="round"/>
      <path d="m47 89-9 21 17-7 5 16 9-25Z" fill="#11a86b"/>
      <path d="m69 89 9 21-17-7-5 16-9-25Z" fill="#d79b24"/>
      <text x="220" y="60" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="27" font-weight="900" fill="#151b22">宅配対応</text>
      <text x="220" y="88" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" font-size="15" font-weight="800" fill="#52606f">送料・手数料無料で送れます</text>
    </g>
  </g>
</svg>
